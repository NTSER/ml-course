<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross-validation, step by step</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--fg:#1b2130;--mut:#5b6474;--pt:#8791a3;--card:#fff;--line:#d8dce4;--est:#2b59d9;--te:#d9730d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--fg:#e8ebf2;--mut:#98a1b3;--pt:#6f7a8f;--card:#181c25;--line:#2b3140;--est:#7c9cff;--te:#ffa94d}}
:root[data-theme="dark"]{--bg:#11141b;--fg:#e8ebf2;--mut:#98a1b3;--pt:#6f7a8f;--card:#181c25;--line:#2b3140;--est:#7c9cff;--te:#ffa94d}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 32px}
h1{font:600 26px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--est);outline-offset:2px}
.steps{display:flex;gap:5px;margin-bottom:10px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--fg)}
.stage{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;flex-wrap:wrap}
canvas{display:block;height:min(52vw,360px);min-height:250px;touch-action:none}
#c1{flex:2 1 380px;width:100%;min-width:0}#c2{flex:1 1 260px;min-width:0;width:100%}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.ctl label{color:var(--mut);font-size:14px;display:flex;gap:8px;align-items:center}
input[type=range]{width:150px}
#read{font-weight:600;min-height:1.5em}
h2{font:600 19px/1.3 system-ui,sans-serif;margin:10px 0 2px}
#cap{color:var(--mut);margin:0;max-width:72ch}
</style></head><body><main>
<h1>Cross-validation, step by step</h1>
<p class="sub">Estimate how well a model predicts new data, and pick its flexibility.</p>
<div class="steps" id="steps"></div>
<div class="stage"><canvas id="c1" aria-label="Scatter plot with folds and fitted curve"></canvas><canvas id="c2" aria-label="Fold errors or error versus flexibility" hidden></canvas></div>
<div class="ctl">
<button id="back">Back</button><button id="next" class="pri">Next</button>
<label>Flexibility (polynomial degree) <b id="dv">3</b><input type="range" id="d" min="1" max="10" value="3"></label>
</div>
<div id="read"></div>
<h2 id="ttl"></h2><p id="cap"></p>
<script>
const $=id=>document.getElementById(id);
let seed=10;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const gauss=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const f=x=>3+2.2*Math.sin(.65*x)+.12*x,SD=1,N=50,K=5,DM=10;
const FC=['#d99a00','#0b8f6a','#9b5de5','#d6336c','#14a3c7'];
const pts=Array.from({length:N},(_,i)=>{const x=(i+rnd())/N*10;return{x,y:f(x)+SD*gauss()}});
const fold=Array(N),ord=Array(N);shuffle([...Array(N).keys()]).forEach((k,pos)=>fold[k]=pos%K);shuffle([...Array(N).keys()]).forEach((k,pos)=>ord[k]=pos);
const cheb=(u,m)=>{const t=[1,u];for(let i=2;i<m;i++)t[i]=2*u*t[i-1]-t[i-2];return t.slice(0,m)};
function fit(P,d){const m=d+1,A=Array.from({length:m},()=>Array(m+1).fill(0));
P.forEach(p=>{const q=cheb((p.x-5)/5,m);for(let i=0;i<m;i++){for(let j=0;j<m;j++)A[i][j]+=q[i]*q[j];A[i][m]+=q[i]*p.y}});
for(let i=0;i<m;i++)A[i][i]+=1e-9;
for(let i=0;i<m;i++){let q=i;for(let r=i+1;r<m;r++)if(Math.abs(A[r][i])>Math.abs(A[q][i]))q=r;[A[i],A[q]]=[A[q],A[i]];for(let r=i+1;r<m;r++){const k=A[r][i]/A[i][i];for(let c=i;c<=m;c++)A[r][c]-=k*A[i][c]}}
const c=Array(m);for(let i=m-1;i>=0;i--){let u=A[i][m];for(let j=i+1;j<m;j++)u-=A[i][j]*c[j];c[i]=u/A[i][i]}return c}
const pr=(c,x)=>{const q=cheb((x-5)/5,c.length);let y=0;for(let i=0;i<c.length;i++)y+=c[i]*q[i];return y};
const mse=(P,c)=>P.reduce((s,p)=>s+(p.y-pr(c,p.x))**2,0)/P.length;
const popTest=Array.from({length:3000},()=>{const x=rnd()*10;return{x,y:f(x)+SD*gauss()}});
const cf=[],cfAll=[],fm=[],cv=[],sdv=[],trn=[],tst=[];
for(let d=1;d<=DM;d++){cf[d]=[];fm[d]=[];for(let r=0;r<K;r++){const c=fit(pts.filter((_,i)=>fold[i]!=r),d);cf[d][r]=c;fm[d][r]=mse(pts.filter((_,i)=>fold[i]==r),c)}
cv[d]=fm[d].reduce((a,b)=>a+b,0)/K;sdv[d]=Math.sqrt(fm[d].reduce((a,b)=>a+(b-cv[d])**2,0)/(K-1));cfAll[d]=fit(pts,d);trn[d]=mse(pts,cfAll[d]);tst[d]=mse(popTest,cfAll[d])}
let pick=1;for(let d=2;d<=DM;d++)if(cv[d]<cv[pick])pick=d;
const T=[["Problem: same data fits and grades the model","Training error only falls as flexibility grows. Try raising the degree."],
["Cut the data into 5 folds",""]];
for(let r=0;r<K;r++)T.push([`Round ${r+1} of 5: fit on 4 folds, test on fold ${r+1}`,""]);
T.push(["Average the 5 errors",""],
["Pick the degree with the lowest CV error","Dashed: true test error (unknown in practice)."]);
const NS=T.length;let step=0,D=3,sT=0,last=0;
$('steps').innerHTML='<i></i>'.repeat(NS-1);
const c1=$('c1'),c2=$('c2'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
function setStep(n){step=Math.max(1,Math.min(NS-1,n));sT=0;document.querySelectorAll('#steps i').forEach((e,i)=>e.classList.toggle('on',i<step));
$('ttl').textContent=`Step ${step} of ${NS-1}: ${T[step][0]}`;$('cap').textContent=T[step][1];$('back').disabled=step==1;$('next').disabled=step==NS-1;c2.hidden=step<2}
$('back').onclick=()=>setStep(step-1);$('next').onclick=()=>setStep(step+1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')setStep(step+1);if(e.key=='ArrowLeft')setStep(step-1)});
$('d').oninput=e=>{D=+e.target.value;$('dv').textContent=D};
function size(c,x){const d=devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;x.setTransform(d,0,0,d,0,0)}}
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cl=u=>Math.max(0,Math.min(1,u));
function drawMain(){size(c1,x1);const ctx=x1,W=c1.clientWidth,H=c1.clientHeight,pl=34,pr_=10,pt=10,pb=26;
const X=x=>pl+x/10*(W-pl-pr_),Y=y=>H-pb-(y+2)/11*(H-pt-pb);
const EST=col('--est'),PT=col('--pt'),L=col('--line'),M=col('--mut'),F=col('--fg');
ctx.clearRect(0,0,W,H);ctx.font='12px system-ui';ctx.fillStyle=M;ctx.strokeStyle=L;ctx.lineWidth=1;
for(let v=0;v<=8;v+=2){ctx.beginPath();ctx.moveTo(pl,Y(v));ctx.lineTo(W-pr_,Y(v));ctx.stroke();ctx.fillText(v,pl-16,Y(v)+4)}
for(let v=0;v<=10;v+=2)ctx.fillText(v,X(v)-3,H-8);ctx.fillText('x',(pl+W-pr_)/2-3,H-8);ctx.fillText('y',6,pt+10);
const rd=step>=2&&step<=6,r=step-2,hid=rd&&sT<1.8;let c=null,fp=1;
const TE=col('--te');
if(step==0||step==8)c=cfAll[D];if(rd){c=cf[D][r];fp=cl((sT-.5)/1)}
const rp=rd?cl((sT-1.8)/.8):0,clamp=y=>Math.max(-3,Math.min(10,y));
if(rp>0)pts.forEach((p,i)=>{if(fold[i]!=r)return;const y=clamp(pr(c,p.x));ctx.beginPath();ctx.moveTo(X(p.x),Y(p.y));ctx.lineTo(X(p.x),Y(p.y+(y-p.y)*rp));ctx.strokeStyle=FC[r];ctx.lineWidth=2.4;ctx.stroke()});
if(step==0&&c){ctx.globalAlpha=.55;pts.forEach(p=>{const y=clamp(pr(c,p.x));ctx.beginPath();ctx.moveTo(X(p.x),Y(p.y));ctx.lineTo(X(p.x),Y(y));ctx.strokeStyle=EST;ctx.lineWidth=1.5;ctx.stroke()});ctx.globalAlpha=1}
const nd=cl(sT/1.6)*N;
pts.forEach((p,i)=>{let colr=PT,rad=3.8,ring=false,al=1,out=false;
if(step==0||step==8){colr=PT;rad=4.2}
if(step==1&&nd>ord[i]){colr=FC[fold[i]];rad=4.8}
if(step==7){colr=FC[fold[i]];rad=4.8}
if(rd){colr=FC[fold[i]];if(fold[i]==r){rad=hid?5.2:6.6;ring=hid;out=!hid}else{rad=4.2;al=.6}}
ctx.beginPath();ctx.arc(X(p.x),Y(p.y),rad,0,7);ctx.globalAlpha=al;
if(ring){ctx.setLineDash([2.5,2.5]);ctx.strokeStyle=colr;ctx.lineWidth=1.8;ctx.stroke();ctx.setLineDash([])}else{ctx.fillStyle=colr;ctx.fill();if(out){ctx.strokeStyle=F;ctx.lineWidth=1.8;ctx.stroke()}}ctx.globalAlpha=1});
if(c&&fp>0){ctx.save();ctx.beginPath();ctx.rect(pl,pt,W-pl-pr_,H-pt-pb);ctx.clip();ctx.beginPath();
for(let x=0;x<=10*fp+1e-6;x+=.05){const y=clamp(pr(c,x));x?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.strokeStyle=EST;ctx.lineWidth=3.2;ctx.stroke();ctx.restore()}
ctx.font='13px system-ui';
const lg=(items)=>{let x=pl+8;items.forEach(([t,cc])=>{ctx.fillStyle=cc;ctx.fillText(t,x,pt+16);x+=ctx.measureText(t).width+18})};
if(step==1||step==7)lg(FC.map((cc,i)=>['● Fold '+(i+1),cc]));
else if(rd){ctx.fillStyle=FC[r];ctx.fillText(hid?`○ fold ${r+1}: test (hidden)`:`● fold ${r+1}: test`,pl+8,pt+16)}
else if(step==0)lg([['● same points fit and grade',EST]]);
else if(step==8)lg([['final model: refit on all 50 points',M]]);
const rdout=$('read');
if(step==0)rdout.textContent=`Training MSE ${trn[D].toFixed(2)}`;
else if(rd)rdout.textContent=hid?`Fitting on the other 4 folds…`:`Fold ${r+1} MSE ${fm[D][r].toFixed(2)}`;
else if(step==7)rdout.textContent=`CV error ${cv[D].toFixed(2)} · std ${sdv[D].toFixed(2)}`;
else if(step==8)rdout.textContent=`Degree ${D}: CV error ${cv[D].toFixed(2)} ± ${sdv[D].toFixed(2)} · best: ${pick}`;
else rdout.textContent=''}
function drawRight(){if(c2.hidden)return;size(c2,x2);const ctx=x2,W=c2.clientWidth,H=c2.clientHeight;
const EST=col('--est'),TE=col('--te'),L=col('--line'),M=col('--mut'),F=col('--fg');
ctx.clearRect(0,0,W,H);ctx.font='13px system-ui';ctx.fillStyle=F;
if(step<8){ctx.fillText('Fit vs test',10,18);
const lw=58,bs=Math.min(26,(W-lw-110)/K),bx=lw,ex=bx+K*bs+10,ml=W-ex-40,rh=(H-76)/(K+2),top=6,cur=step-2;
ctx.font='11px system-ui';ctx.fillStyle=M;for(let i=0;i<K;i++)ctx.fillText('F'+(i+1),bx+i*bs+bs*.2,42);ctx.fillText('error',ex,42);
for(let r=0;r<K;r++){const y0=50+r*rh,on=step>=7||r<=cur,now=step<=6&&r==cur;
if(now){ctx.fillStyle=F;ctx.globalAlpha=.08;ctx.fillRect(4,y0-3,W-8,rh);ctx.globalAlpha=1}
ctx.font='12px system-ui';ctx.fillStyle=on?F:M;ctx.fillText('Round '+(r+1),8,y0+rh*.55);
for(let i=0;i<K;i++){ctx.globalAlpha=on?(i==r?1:.4):.12;ctx.fillStyle=FC[i];ctx.fillRect(bx+i*bs+1,y0+2,bs-2,rh-8);ctx.globalAlpha=on?1:.12;if(i==r){ctx.strokeStyle=F;ctx.lineWidth=2;ctx.strokeRect(bx+i*bs+2,y0+3,bs-4,rh-10)}ctx.globalAlpha=1}
const done=step>=7||r<cur,g=done?1:now?cl((sT-2.6)/.6):0;
if(g>0){ctx.fillStyle=FC[r];ctx.fillRect(ex,y0+4,ml*Math.min(fm[D][r],top)/top*g,rh-12);if(fm[D][r]>top){ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText('▶ '+fm[D][r].toFixed(1),ex+ml*g-3,y0+rh*.55);ctx.textAlign='left'}else{ctx.fillStyle=F;ctx.fillText(fm[D][r].toFixed(2),ex+ml*fm[D][r]/top*g+4,y0+rh*.55)}}}
if(step==7){const y0=50+K*rh,bw=v=>ml*Math.min(v,top)/top;ctx.strokeStyle=M;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(8,y0-2);ctx.lineTo(W-8,y0-2);ctx.stroke();
ctx.font='12px system-ui';ctx.fillStyle=F;ctx.fillText('Average',8,y0+rh*.55);ctx.fillRect(ex,y0+4,bw(cv[D]),rh-12);ctx.fillText('CV '+cv[D].toFixed(2),ex+bw(cv[D])+4,y0+rh*.55);
const y1=y0+rh;ctx.fillStyle=M;ctx.fillText('Std',8,y1+rh*.55);ctx.fillRect(ex,y1+4,bw(sdv[D]),rh-12);ctx.fillStyle=F;ctx.fillText(sdv[D].toFixed(2),ex+bw(sdv[D])+4,y1+rh*.55)}

}else{ctx.fillText('Error vs flexibility',10,18);
const pl=34,pr_=12,pt=48,pb=34,top=5,X=d=>pl+(d-1)/(DM-1)*(W-pl-pr_),Y=v=>H-pb-Math.min(v,top)/top*(H-pt-pb);
ctx.font='12px system-ui';ctx.strokeStyle=L;ctx.fillStyle=M;ctx.lineWidth=1;
for(let v=0;v<=top;v++){ctx.beginPath();ctx.moveTo(pl,Y(v));ctx.lineTo(W-pr_,Y(v));ctx.stroke();ctx.fillText(v,pl-14,Y(v)+4)}
[1,5,10].forEach(d=>ctx.fillText(d,X(d)-3,H-18));ctx.fillText('flexibility (degree) →',pl+20,H-4);
const ln=(a,cc,w,dash)=>{ctx.setLineDash(dash||[]);ctx.beginPath();for(let d=1;d<=DM;d++)d>1?ctx.lineTo(X(d),Y(a[d])):ctx.moveTo(X(d),Y(a[d]));ctx.strokeStyle=cc;ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(X(D),Y(a[D]),4.5,0,7);ctx.fillStyle=cc;ctx.fill()};
ctx.beginPath();ctx.moveTo(X(D),pt);ctx.lineTo(X(D),H-pb);ctx.strokeStyle=M;ctx.globalAlpha=.4;ctx.stroke();ctx.globalAlpha=1;
ln(tst,TE,2,[5,4]);ln(trn,EST,2);ln(cv,F,3.2);
const lo=Y(Math.max(cv[D]-sdv[D],0)),hi=Y(cv[D]+sdv[D]);ctx.strokeStyle=F;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(D),lo);ctx.lineTo(X(D),hi);ctx.moveTo(X(D)-5,lo);ctx.lineTo(X(D)+5,lo);ctx.moveTo(X(D)-5,hi);ctx.lineTo(X(D)+5,hi);ctx.stroke();
ctx.beginPath();ctx.arc(X(pick),Y(cv[pick]),9,0,7);ctx.strokeStyle=F;ctx.lineWidth=2;ctx.stroke();
ctx.font='12px system-ui';[['CV error',F],['training error',EST],['true test error',TE]].forEach(([t,cc],i)=>{ctx.fillStyle=cc;ctx.fillText('● '+t,10+[0,70,168][i],34)});
ctx.fillStyle=F;ctx.fillText('CV picks '+pick,X(pick)+12,Y(cv[pick])-24)}}
function tick(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;sT+=dt;drawMain();drawRight();requestAnimationFrame(tick)}
setStep(1);requestAnimationFrame(tick);
</script></main></body></html>
