<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Why stratify in train_test_split</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--fg:#1b2130;--mut:#5b6474;--card:#fff;--line:#d8dce4;--ga:#2b59d9;--gc:#d6336c;--gb:#d98a00;--ok:#0b8f6a;--code:#eceff4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--fg:#e8ebf2;--mut:#98a1b3;--card:#181c25;--line:#2b3140;--ga:#7c9cff;--gc:#ff6b9a;--gb:#ffb84d;--ok:#3ddc9f;--code:#222838}}
:root[data-theme="dark"]{--bg:#11141b;--fg:#e8ebf2;--mut:#98a1b3;--card:#181c25;--line:#2b3140;--ga:#7c9cff;--gc:#ff6b9a;--gb:#ffb84d;--ok:#3ddc9f;--code:#222838}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 32px}
h1{font:600 26px/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
p.sub{margin:0 0 12px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
button:focus-visible{outline:2px solid var(--ga);outline-offset:2px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.modes button{border:0;border-radius:0}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
pre{margin:0 0 10px;padding:8px 12px;background:var(--code);border-radius:8px;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre}
pre b{color:var(--gc)}
.stage{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
canvas{display:block;height:min(130vw,640px);min-height:620px}
#c1{flex:3 1 400px;min-width:0;width:100%}#c2{flex:2 1 270px;min-width:0;width:100%}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
#read{font-weight:600;min-height:1.5em}
.hist{margin:8px 0;color:var(--mut);font-size:15px}
.hist div{margin:4px 0}
.hist b{color:var(--fg)}
.chip{display:inline-block;min-width:1.5em;text-align:center;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-right:4px;color:var(--fg);background:var(--card)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.off{background:var(--gc);border-color:var(--gc);color:#fff}
.chip{padding:0 8px}
#cap{color:var(--mut);margin:6px 0 0;max-width:75ch}
</style></head><body><main>
<h1>Why stratify in train_test_split</h1>
<p class="sub" id="sub">The test set should keep the group mix of the whole dataset.</p>
<pre id="code"></pre>
<div class="ctl"><span class="modes" id="modes"><button data-m="0" aria-pressed="true">Random split</button><button data-m="1" aria-pressed="false">Stratified split</button></span><button id="one" class="pri">Split</button></div>
<div class="stage"><canvas id="c1" aria-label="Dataset of 125 rows with the rows picked for the test set"></canvas><canvas id="c2" aria-label="Test set and its class mix"></canvas></div>
<div id="read"></div>
<p id="cap"></p>
<script>
const $=id=>document.getElementById(id);
let seed=41;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const N=125,SZ=[120,5],ST=[0,120],TG=[24,1],TEST=25,NAME=['A','B'],CV=['--ga','--gb'],NC=2,PCT=SZ.map(v=>v*100/N);
const cls=i=>i<120?0:1;
const CODE=["train_test_split(df, test_size=0.2)","train_test_split(df, test_size=0.2, <b>stratify=df['group']</b>)"];
const CAP=['',''];
const PERM=shuffle([...Array(N).keys()]);
let mode=0,sp=null,last=0;const hist=[[],[]];
function setMode(m){mode=m;sp=null;document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==m));$('code').innerHTML=CODE[m];$('sub').textContent=m?'A stratum = all rows with the same group value. We sample 20% within each stratum.':'The test set should keep the group mix of the whole dataset.';$('cap').textContent=CAP[m]}
function newSplit(fast){const pd=fast?.03:.06,gap=fast?.3:.5,times=[];let picks,lab=[0,0];
if(mode==0){picks=shuffle([...Array(N).keys()]).slice(0,TEST);picks.forEach((_,i)=>times.push(i*pd))}
else{picks=[];let t=0;for(let c=0;c<NC;c++){lab[c]=t;const g=shuffle(Array.from({length:SZ[c]},(_,i)=>ST[c]+i)).slice(0,TG[c]);g.forEach((id,j)=>{picks.push(id);times.push(t+j*pd*(c==0?1:2))});t+=TG[c]*pd*(c==0?1:2)+gap}}
sp={picks,times,lab,t:0,mode,rec:false,end:times[times.length-1]+(fast?.7:.5),fast}}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
$('one').onclick=()=>newSplit(false);
function chips(m){if(!$('h'+m))return;$('h'+m).innerHTML=hist[m].length?hist[m].slice(-8).map(v=>`<span class="chip ${v.join()==TG.join()?'ok':'off'}">${v.join('·')}</span>`).join(''):'–'}
const c1=$('c1'),c2=$('c2'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
function size(c,x){const d=devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;x.setTransform(d,0,0,d,0,0)}}
const col=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function rowGlyph(ctx,cx,cy,w,h,c,m,al,ring,fg){const cw=w/3;ctx.globalAlpha=al*.4;ctx.fillStyle=m;ctx.fillRect(cx-w/2,cy-h/2,cw-1,h);ctx.fillRect(cx-w/2+cw,cy-h/2,cw-1,h);ctx.globalAlpha=al;ctx.fillStyle=c;ctx.fillRect(cx-w/2+2*cw,cy-h/2,cw,h);ctx.globalAlpha=1;if(ring){ctx.strokeStyle=fg;ctx.lineWidth=1.8;ctx.strokeRect(cx-w/2-2,cy-h/2-2,w+4,h+4)}}
function state(){if(!sp)return{rev:[],cnt:[0,0],done:false};const rev=[];sp.picks.forEach((id,k)=>{if(sp.times[k]<=sp.t)rev.push(id)});
const cnt=[0,0];rev.forEach(id=>cnt[cls(id)]++);return{rev,cnt,done:sp.t>=sp.end}}
function drawPool(st){size(c1,x1);const ctx=x1,W=c1.clientWidth,H=c1.clientHeight;if(W<150||H<100)return;const ml=14,wd=W>=470,lw=wd?150:124,mt=wd?58:98,mb=8,gm=14;
const tw=Math.max(60,Math.min(W-ml-lw,300)),pitch=(H-mt-mb-gm)/N,rh=Math.max(2,pitch-1.3);
const FG=col('--fg'),M=col('--mut'),L=col('--line'),CC=CV.map(col);
const strat=(sp?sp.mode:mode)==1,G=strat?gm:0;
const Y=i=>mt+i*pitch+pitch/2+(i>=120?G:0),cx=ml+tw/2;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=FG;ctx.font='600 13px system-ui';ctx.fillText('Dataset: 125 rows',ml,18);ctx.font='13px system-ui';
for(let c=0;c<NC;c++){ctx.fillStyle=CC[c];ctx.fillText(`■ group = ${NAME[c]} (${SZ[c]} rows)`,wd?ml+126+c*158:ml,wd?18:36+c*18)}
ctx.fillStyle=M;ctx.font='12px system-ui';[['x₁',1/6],['x₂',.5],['group',5/6]].forEach(([t,f])=>ctx.fillText(t,ml+tw*f-4,mt-8));
const set=new Set(st.rev),started=!!sp&&st.rev.length>0;
ctx.strokeStyle=L;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
const box=(a,b)=>ctx.strokeRect(ml-8,Y(a)-pitch/2-3,tw+16,(b-a)*pitch+6);
if(strat){box(0,120);box(120,125)}else ctx.strokeRect(ml-8,Y(0)-pitch/2-3,tw+16,N*pitch+6);
ctx.setLineDash([]);
for(let i=0;i<N;i++){const on=set.has(i),yy=Y(strat?i:PERM[i]);
rowGlyph(ctx,cx,yy,tw,rh,CC[cls(i)],M,on?1:(started?.22:.95),false,FG);
if(on){ctx.strokeStyle=FG;ctx.lineWidth=1.2;ctx.strokeRect(ml-3,yy-rh/2-1,tw+6,rh+2)}}
const lx=ml+tw+16;
const lab=(y,l1,l2,c,l3)=>{y=Math.min(y,H-(l3?26:22));ctx.fillStyle=c;ctx.font='600 13px system-ui';ctx.fillText(l1,lx,y-(l3?18:2));ctx.font='13px system-ui';ctx.fillText(l2,lx,y+(l3?0:16));if(l3)ctx.fillText(l3,lx,y+18)};
if(strat){for(let c=0;c<NC;c++){const a=ST[c],b=a+SZ[c];lab((Y(a)+Y(b-1))/2,`Stratum ${NAME[c]}`,`20% of ${SZ[c]} rows`,CC[c],sp&&sp.t>=sp.lab[c]?`${st.cnt[c]} of ${TG[c]} sampled`:`= ${TG[c]} rows`)}}
else lab((Y(0)+Y(N-1))/2,'25 of 125 rows',sp?`${st.rev.length} of 25 sampled`:'sampled at random',FG)}
function drawTest(st){size(c2,x2);const ctx=x2,W=c2.clientWidth,H=c2.clientHeight;if(W<120||H<100)return;
const FG=col('--fg'),M=col('--mut'),L=col('--line'),CC=CV.map(col);
ctx.clearRect(0,0,W,H);ctx.font='600 14px system-ui';ctx.fillStyle=FG;ctx.fillText('Test set: 25 rows',10,20);
const rw=Math.min(W-20,240),rh=11,pitch=13,rs=38,gx=10+rw/2;
ctx.fillStyle=M;ctx.font='12px system-ui';[['x₁',1/6],['x₂',.5],['group',5/6]].forEach(([t,f])=>ctx.fillText(t,10+rw*f-4,32));
for(let k=0;k<TEST;k++){const cy=rs+k*pitch+rh/2;
if(k<st.rev.length)rowGlyph(ctx,gx,cy,rw,rh,CC[cls(st.rev[k])],M,1,false,FG);
else{ctx.strokeStyle=L;ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.strokeRect(gx-rw/2,cy-rh/2,rw,rh);ctx.setLineDash([])}}
const by=rs+TEST*pitch+22,bw=W-20,bh=20,y2=by+bh+34;
const bar=(y,label,fr)=>{ctx.fillStyle=M;ctx.font='13px system-ui';ctx.fillText(label,10,y-6);let x=10;for(let c=0;c<NC;c++){ctx.fillStyle=CC[c];ctx.fillRect(x,y,bw*fr[c],bh);x+=bw*fr[c]}ctx.strokeStyle=L;ctx.lineWidth=1;ctx.strokeRect(10,y,bw,bh)};
const n=st.rev.length;bar(by,'Whole dataset',SZ.map(v=>v/N));bar(y2,'Test set',st.cnt.map(v=>v/TEST));
const ty=y2+bh+26,c1x=W*.42,c2x=W*.72;ctx.font='600 13px system-ui';ctx.fillStyle=M;ctx.fillText('in dataset',c1x,ty);ctx.fillText('in test set',c2x,ty);
for(let c=0;c<NC;c++){const yy=ty+22*(c+1),got=n?st.cnt[c]*100/TEST:null,ok=got===PCT[c];ctx.font='600 13px system-ui';ctx.fillStyle=CC[c];ctx.fillText('■ '+NAME[c],10,yy);ctx.fillStyle=FG;ctx.fillText(PCT[c]+'%',c1x,yy);ctx.fillStyle=got===null?M:ok?col('--ok'):FG;ctx.fillText(got===null?'–':got+'%'+(ok?' ✓':' ✗'),c2x,yy)}}
function tick(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
if(sp){sp.t+=dt;if(sp.t>=sp.end&&!sp.rec){sp.rec=true;const c=[0,0];sp.picks.forEach(i=>c[cls(i)]++);hist[sp.mode].push(c);chips(sp.mode)}}
const st=state();drawPool(st);drawTest(st);
$('read').textContent=!sp?'Press Split.':'';
requestAnimationFrame(tick)}
setMode(0);chips(0);chips(1);requestAnimationFrame(tick);
</script></main></body></html>
