const uvz3=(b,w,J)=>{const[A,B]=B3.rng;return[(clamp(b,A[0],A[1])-A[0])/(A[1]-A[0])*2-1,(clamp(w,B[0],B[1])-B[0])/(B[1]-B[0])*2-1,Math.min(J/B3.Jmax,1.05)*(B3.kind?.8:1.2)]};

act.forEach(V=>{const o=pj(V.disp);dot(ctx,o.x,o.y,6.5,col(V.col),CD)})}
function pick3(cx,cy){const W=c2.clientWidth,H=c2.clientHeight,[A,B]=B3.rng,N=90;let best=null;
for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const p=[A[0]+(A[1]-A[0])*i/N,B[0]+(B[1]-B[0])*j/N],[u,v,z]=uvz3(p[0],p[1],J3(p)),o=proj3(u,v,z,W,H),dd=Math.hypot(o.x-cx,o.y-cy);

function drawChart3(){size(c3,x3);const ctx=x3,W=c3.clientWidth,H=c3.clientHeight;if(W<150||H<120)return;ctx.clearRect(0,0,W,H);
const nw=W<460,FG=col('--fg'),MU=col('--mut'),LN=col('--line'),act=act3(),ml=48,mr=14,mt=nw?42:28,mb=34,PW=W-ml-mr,PH=H-mt-mb,J0=J3(B3.start),lo=Math.log(B3.Jmin*.7),hi=Math.max(Math.log(J0*1.15),Math.log(B3.Jmin*.7)+1.2);

ctx.font='12px system-ui';let lx=W-mr;[...act].reverse().forEach(V=>{const t='■ '+V.name,w=ctx.measureText(t).width;lx-=w;ctx.fillStyle=col(V.col);ctx.fillText(t,lx,nw?34:16);lx-=14});
